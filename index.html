<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardMap NY</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Favicon para navegadores de escritorio y móviles -->
    <script src="cards-data.js"></script>
    <link rel="icon" type="image/jpeg" href="image/01_d.jpg">
</head>
<body>

    <header>
        <h1 id="card-type-title">Portada</h1>
    </header>

    <div class="viewer-container">
        <!-- Tarjeta Interactiva -->
        <div class="card-wrapper" onclick="toggleFlip()">
            <div class="card-inner" id="card-inner">
                <!-- Anverso (Frente) -->
                <div class="card-face card-front">
                    <img id="img-front" src="" alt="Frente de la carta">
                </div>
                <!-- Reverso (Dorso) -->
                <div class="card-face card-back">
                    <img id="img-back" src="" alt="Dorso de la carta">
                </div>
            </div>
        </div>

        <!-- Botón para el enlace de YouTube -->
        <a id="card-link" href="#" target="_blank" class="youtube-button">
            📺 Ver vídeo en YouTube
        </a>

        <!-- Controles Principales -->
        <div class="controls">
            <button id="btn-prev" onclick="prevCard()">◀ Anterior</button>
            <button id="btn-flip" onclick="toggleFlip()">Girar ↻</button>
            <button id="btn-next" onclick="nextCard()">Siguiente ▶</button>
        </div>

        <!-- Controles de Ruta y Puntos -->
        <div class="controls map-controls" style="margin-top: 10px;">
            <button id="btn-route" style="display: none;">🗺️ Crear Ruta</button>
            <button id="btn-points" style="display: none;">📍 Ver Puntos</button>
        </div>

        

        <!-- Selector rápido -->
        <div class="jump-container">
            <select id="card-select" onchange="jumpToCard(this.value)">
                <!-- Se genera dinámicamente mediante JS -->
            </select>
        </div>

    </div>

    <!-- Modal para mostrar la lista de Puntos de Interés -->
    <div id="points-modal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(2px);">
        <div class="modal-content" style="background-color: #fff; margin: 12% auto; padding: 24px; border-radius: 12px; max-width: 480px; width: 90%; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
            <span id="close-modal" style="position: absolute; right: 18px; top: 12px; cursor: pointer; font-size: 28px; color: #666; font-weight: bold;">&times;</span>
            <h3 id="modal-title" style="margin-top: 0; margin-bottom: 15px; color: #333; font-size: 1.25rem;">Puntos de Interés</h3>
            <ul id="points-list" style="list-style-type: none; padding-left: 0; margin: 0; max-height: 320px; overflow-y: auto;">
                <!-- Se llena dinámicamente desde el JS -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
